<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>RadioKiosk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="back" class="icon" hidden aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="titles">
      <h1 id="heading">RadioKiosk</h1>
      <small id="version" hidden></small>
    </div>
    <div id="ticker" hidden></div>
    <div id="clock"><span id="clock-extra"></span><span id="clock-now"><b id="clock-time"></b><small id="clock-date"></small></span></div>
  </header>

  <div id="warn" hidden></div>
  <div id="remind" hidden></div>

  <main id="view"></main>

  <footer id="bar">
    <div id="now">
      <strong id="now-title"></strong>
      <span id="now-text"></span>
    </div>
    <button id="vol-down" class="icon" aria-label="Volume down">
      <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
    </button>
    <output id="vol"></output>
    <button id="vol-up" class="icon" aria-label="Volume up">
      <svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>
    </button>
    <button id="mute" class="icon" aria-label="Mute">
      <svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6l-5 4z"/><path class="sound" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button id="rec" class="icon" aria-label="Record" disabled>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></svg>
    </button>
    <button id="stop" class="icon" aria-label="Stop">
      <svg viewBox="0 0 24 24"><rect class="square" x="7" y="7" width="10" height="10" rx="1"/><path class="pause" d="M9 6.5v11M15 6.5v11"/><path class="go" d="M8.5 6.5l9.5 5.500-9.500 5.500z"/><rect class="hold" x="2.5" y="2.5" width="19" height="19" rx="2" pathLength="100"/></svg>
    </button>
  </footer>

  <div id="idle" hidden>
    <div id="idle-news"></div>
    <div id="idle-box">
      <div id="idle-time"></div>
      <div id="idle-date"></div>
      <div id="idle-extra"></div>
      <div id="idle-title"></div>
      <div id="idle-text"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
